version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: supermarket-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: supermarket_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: supermarket-api
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/supermarket_db
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=adminpassword
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update

volumes:
  postgres_data: